<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <radialGradient id="blob-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C5CFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFA"/>
      <stop offset="50%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#FF5E3A"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#3a3a3c"/>
    </linearGradient>
    <filter id="badge-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Decorative gradient blobs -->
  <ellipse cx="100" cy="100" rx="350" ry="280" fill="url(#blob-1)"/>
  <ellipse cx="1100" cy="550" rx="380" ry="300" fill="url(#blob-2)"/>

  <!-- Logo + brand top left -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#logo-grad)"/>
    <path d="M 18 28 L 25 36 L 40 21" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="38" font-family="Inter Tight, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">Sweep</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="260" font-family="Inter Tight, sans-serif" font-size="22" font-weight="600" fill="url(#brand-grad)" letter-spacing="-0.3">
    INDUSTRY-FIRST TRIPLE-AI VERIFICATION
  </text>

  <!-- Headline -->
  <text x="80" y="350" font-family="Inter Tight, sans-serif" font-size="84" font-weight="700" fill="#1d1d1f" letter-spacing="-3.2">
    QA testing in 3 minutes.
  </text>
  <text x="80" y="445" font-family="Inter Tight, sans-serif" font-size="84" font-weight="700" fill="#1d1d1f" letter-spacing="-3.2">
    Not 3 days.
  </text>

  <!-- Verified badges -->
  <g transform="translate(80, 510)" filter="url(#badge-shadow)">
    <!-- Claude badge -->
    <rect x="0" y="0" width="200" height="48" rx="24" fill="white" stroke="#e8e8ed" stroke-width="1"/>
    <circle cx="24" cy="24" r="8" fill="#FF6B35"/>
    <text x="44" y="31" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#1d1d1f" letter-spacing="-0.3">
      Claude verified
    </text>

    <!-- GPT-4 badge -->
    <rect x="220" y="0" width="200" height="48" rx="24" fill="white" stroke="#e8e8ed" stroke-width="1"/>
    <circle cx="244" cy="24" r="8" fill="#10A37F"/>
    <text x="264" y="31" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#1d1d1f" letter-spacing="-0.3">
      GPT-4 verified
    </text>

    <!-- Gemini badge -->
    <rect x="440" y="0" width="208" height="48" rx="24" fill="white" stroke="#e8e8ed" stroke-width="1"/>
    <circle cx="464" cy="24" r="8" fill="#4285F4"/>
    <text x="484" y="31" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#1d1d1f" letter-spacing="-0.3">
      Gemini verified
    </text>
  </g>

  <!-- Subtle consensus circle bottom right, below headline -->
  <g transform="translate(940, 420)">
    <circle cx="80" cy="80" r="78" fill="url(#brand-grad)" opacity="0.12"/>
    <circle cx="80" cy="80" r="65" fill="url(#brand-grad)" opacity="0.20"/>
    <circle cx="80" cy="80" r="52" fill="url(#brand-grad)"/>
    <text x="80" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="white" letter-spacing="0.8">CONSENSUS</text>
    <text x="80" y="100" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="28" font-weight="800" fill="white" letter-spacing="-1">0.96</text>
  </g>
</svg>
